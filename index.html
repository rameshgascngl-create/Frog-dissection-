<html lang="en">
<head>

  <title>Virtual Frog Dissection Simulator — Hoplobatrachus tigerinus</title>
  <style>
    /* ==========================================================================
       1. DESIGN TOKENS & BASE RESET (100% OFFLINE SINGLE-FILE)
       ========================================================================== */
    :root {
      --bg-app: #09101a;
      --bg-panel: #111b29;
      --bg-card: #182638;
      --bg-card-hover: #21344c;
      --border-subtle: #283c56;
      --border-active: #14b8a6;
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --accent-teal: #14b8a6;
      --accent-amber: #f59e0b;
      --accent-rose: #f43f5e;
      --accent-sky: #38bdf8;
      --shadow-lg: 0 14px 30px -6px rgba(0, 0, 0, 0.65);
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-primary);
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    button, select, input {
      font-family: inherit;
      color: inherit;
    }

    button {
      cursor: pointer;
      border: none;
      background: none;
      transition: all 0.18s ease;
    }

    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid var(--accent-teal);
      outline-offset: 2px;
    }

    /* ==========================================================================
       2. HEADER & NAVIGATION BAR
       ========================================================================== */
    .app-header {
      background: linear-gradient(135deg, #0d1724 0%, #152436 100%);
      border-bottom: 1px solid var(--border-subtle);
      padding: 0.7rem 1.25rem;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: rgba(20, 184, 166, 0.16);
      border: 1px solid rgba(20, 184, 166, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-teal);
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
    }

    .brand-title p {
      font-size: 0.75rem;
      color: var(--text-secondary);
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      background: var(--bg-app);
      padding: 0.25rem;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      gap: 0.2rem;
    }

    .mode-tab {
      padding: 0.42rem 0.82rem;
      border-radius: 7px;
      font-size: 0.81rem;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .mode-tab.active {
      background: var(--accent-teal);
      color: #042f2e;
    }

    .pill-btn {
      padding: 0.42rem 0.8rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      color: var(--text-primary);
    }

    .pill-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-teal);
    }

    .pill-btn.active {
      background: rgba(20, 184, 166, 0.18);
      border-color: var(--accent-teal);
      color: var(--accent-teal);
    }

    /* ==========================================================================
       3. THREE-COLUMN LABORATORY WORKSPACE
       ========================================================================== */
    .workspace {
      display: grid;
      grid-template-columns: 285px 1fr 340px;
      gap: 1rem;
      padding: 1rem;
      flex: 1;
      max-width: 1700px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 1200px) {
      .workspace {
        grid-template-columns: 260px 1fr;
      }
      .inspector-column {
        grid-column: 1 / -1;
      }
    }

    @media (max-width: 820px) {
      .workspace {
        grid-template-columns: 1fr;
        padding: 0.75rem;
      }
    }

    .panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 0.95rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      box-shadow: var(--shadow-lg);
    }

    .panel-heading {
      font-size: 0.76rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-weight: 700;
      color: var(--accent-teal);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 0.45rem;
    }

    /* ==========================================================================
       4. LEFT SIDEBAR: INSTRUMENTS, LAYERS & PROTOCOL
       ========================================================================== */
    .tool-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.45rem;
    }

    .tool-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 0.55rem 0.45rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.77rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-align: center;
    }

    .tool-btn:hover {
      background: var(--bg-card-hover);
      color: var(--text-primary);
    }

    .tool-btn.active {
      background: rgba(20, 184, 166, 0.16);
      border-color: var(--accent-teal);
      color: #ffffff;
      box-shadow: inset 0 0 0 1px var(--accent-teal);
    }

    .tool-btn svg {
      width: 21px;
      height: 21px;
      stroke: currentColor;
    }

    .layer-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .layer-btn {
      width: 100%;
      text-align: left;
      padding: 0.55rem 0.7rem;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
    }

    .layer-btn:hover {
      background: var(--bg-card-hover);
    }

    .layer-btn.active {
      background: rgba(20, 184, 166, 0.16);
      border-color: var(--accent-teal);
    }

    .layer-badge {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 0.15rem 0.42rem;
      border-radius: 6px;
      background: var(--bg-app);
      color: var(--accent-teal);
      border: 1px solid var(--border-subtle);
    }

    .layer-title {
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-primary);
      display: block;
    }

    .layer-sub {
      font-size: 0.71rem;
      color: var(--text-secondary);
      display: block;
    }
