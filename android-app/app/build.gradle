plugins {
    id 'com.android.application'
}

android {
    namespace 'org.gasczoology.frogdissection'
    compileSdk 35

    defaultConfig {
        applicationId 'org.gasczoology.frogdissection'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main.assets.srcDirs = ['src/main/assets']
    }
}
