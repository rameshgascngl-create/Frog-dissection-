name: Pure Native Frog Dissection Android QA

on:
  push:
    branches:
      - native/compose-frog-dissection-20261119
    paths:
      - 'native-android/**'
      - '.github/workflows/native-compose-apk.yml'
      - '*.jpg'
      - '*.avif'
  workflow_dispatch:

jobs:
  native-compose-qa:
    name: Build and test native Compose APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Copy original six specimen photographs into native assets
        run: |
          set -euo pipefail
          dest=native-android/app/src/main/assets
          mkdir -p "$dest"
          cp "frog external.jpg" "frog muscle.jpg" "frog viscera.jpg" "frog heart.jpg" \
             "Internal deep male.avif" "Internal deep female.avif" "$dest/"
          python3 - <<'PY'
          import json, pathlib
          d=pathlib.Path('native-android/app/src/main/assets')
          corpus=json.loads((d/'frog_corpus.json').read_text())
          assert len(corpus['organs']) == 31
          assert len(corpus['questions']) == 26
          assert len(corpus['steps']) == 6
          for item in corpus['layers']:
              assert (d/item['image']).is_file()
              if item.get('femaleImage'):
                  assert (d/item['femaleImage']).is_file()
          print('Native corpus and six offline plates verified')
          PY
      - name: Native JVM unit tests
        working-directory: native-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Compile native APK (no WebView)
        working-directory: native-android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify native APK and record SHA
        run: |
          set -euo pipefail
          apk=native-android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          if grep -R 'android.webkit.WebView\|loadUrl("file:' native-android/app/src/main/java; then
            echo 'Unexpected WebView code in pure native app'; exit 1
          fi
          sha256sum "$apk" | tee native-android/apk-sha256.txt
      - name: Publish native QA APK
        uses: actions/upload-artifact@v4
        with:
          name: FrogDissection-Pure-Native-Compose-QA-APK
          path: |
            native-android/app/build/outputs/apk/debug/app-debug.apk
            native-android/apk-sha256.txt
          retention-days: 30
          if-no-files-found: error
