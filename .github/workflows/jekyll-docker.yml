name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  anatomical-smoke:
    name: Anatomical image and JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check anatomy plates and application JavaScript
        run: node --test tests/frog-smoke.test.cjs

  browser-smoke:
    name: Chromium interaction smoke test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.58.2
      - name: Exercise anatomy, specimen switching and quiz
        run: node tests/browser-smoke.cjs
      - name: Upload six-plate anatomical review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frog-anatomical-plate-review
          path: qa-evidence/
          if-no-files-found: warn
          retention-days: 30

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
