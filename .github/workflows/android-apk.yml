name: Android Frog Dissection APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '*.jpg'
      - '*.avif'
      - 'android-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build-debug-apk:
    name: Build offline Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35 using runner tools
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package current HTML and offline photographs
        run: |
          set -euo pipefail
          dst=android-app/app/src/main/assets
          mkdir -p "$dst"
          cp index.html "$dst/index.html"
          cp "frog external.jpg" "$dst/"
          cp "frog muscle.jpg" "$dst/"
          cp "frog viscera.jpg" "$dst/"
          cp "frog heart.jpg" "$dst/"
          cp "Internal deep male.avif" "$dst/"
          cp "Internal deep female.avif" "$dst/"
          test -s "$dst/index.html"
          test "$(find "$dst" -type f \( -name '*.jpg' -o -name '*.avif' \) | wc -l)" -eq 6
      - name: Assemble debug APK
        working-directory: android-app
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Verify APK
        run: |
          test -s android-app/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-app/app/build/outputs/apk/debug/app-debug.apk | tee android-app/apk-sha256.txt
          ls -lh android-app/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FrogDissection-Android-Debug-APK
          path: |
            android-app/app/build/outputs/apk/debug/app-debug.apk
            android-app/apk-sha256.txt
          retention-days: 30
          if-no-files-found: error
