name: Frog Native Android Emulator Acceptance

on:
  push:
    branches: [native/compose-frog-dissection-20261119]
    paths:
      - 'native-android/**'
      - '.github/workflows/native-device-acceptance.yml'
  workflow_dispatch:

jobs:
  emulator-qa:
    name: API 34 Compose UI at 100% and 200% fonts
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install compilation SDK
        run: |
          set -euo pipefail
          sdk="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          "$sdk" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Copy all offline photographic plates
        run: |
          set -euo pipefail
          dst=native-android/app/src/main/assets
          cp "frog external.jpg" "frog muscle.jpg" "frog viscera.jpg" "frog heart.jpg" \
            "Internal deep male.avif" "Internal deep female.avif" "$dst/"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run native UI checks with regular and enlarged fonts
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          script: |
            adb shell settings put system font_scale 1.0
            gradle --project-dir native-android --no-daemon :app:connectedDebugAndroidTest
            adb shell settings put system font_scale 2.0
            gradle --project-dir native-android --no-daemon :app:connectedDebugAndroidTest
      - name: Publish emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Frog-Native-Emulator-Acceptance
          path: |
            native-android/app/build/reports/androidTests/
            native-android/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
